name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare video player
        run: |
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 1 -type f -iname "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "No HTML file found"
            exit 1
          fi
          cp "$HTML_FILE" www/index.html

      - name: Configure Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sanku.mobilecinema",
            "appName": "Mobile Cinema Player",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Cinema-Player-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
