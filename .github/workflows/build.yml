
name: Build Sanku APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare video player
        run: |
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 1 -type f -iname "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "No HTML file found"
            exit 1
          fi
          cp "$HTML_FILE" www/index.html

      - name: Configure Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sanku.mobilecinema",
            "appName": "Sanku",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Add fullscreen support
        run: |
          mkdir -p android/app/src/main/java/com/sanku/mobilecinema
          cp MainActivity.java android/app/src/main/java/com/sanku/mobilecinema/MainActivity.java
          cp VideoLibraryPlugin.java android/app/src/main/java/com/sanku/mobilecinema/VideoLibraryPlugin.java

      - name: Add video permissions
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sanku-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
